<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NS Work · Northstar</title><link rel="stylesheet" href="/style.css?v=20261004-no-code-button"></head>
<body><div class="shell">
<aside class="sidebar"><a class="brand" href="#" aria-label="NS Work home"><img src="/logo.svg" alt="NS Work"></a><div class="workspace"><span class="workspace-icon">N</span><div>Northstar<small>Company workspace</small></div></div><button id="new-task" class="new-task"><span>＋</span> New task</button><div class="sidebar-label">YOUR WORK</div><nav id="history" aria-label="Recent tasks"></nav><div class="sidebar-bottom"><button class="quiet" id="configuration">Explore the harness <span>↗</span></button></div></aside>
<main><header><span id="breadcrumb">Your workspace</span><div class="header-actions"><div class="profile-control" title="Changing profile starts a separate conversation"><label for="profile">Profile</label><select id="profile"><option value="sales">Sales</option><option value="engineering">Engineering</option><option value="finance">Finance</option></select></div><button id="files-button" class="quiet" hidden>Files <span id="file-count"></span></button></div></header>
<div class="work-area"><section class="conversation"><div id="welcome"><div class="eyebrow">NORTHSTAR’S OWN HARNESS</div><h1>Good work starts here.</h1><p class="subtitle">Your company’s knowledge. Your way of working.</p><div id="starters"></div></div><div id="messages" aria-live="polite"></div><div id="artifacts"></div><div id="run-status" role="status"></div><div id="approval"></div><div class="composer-wrap"><form id="composer"><textarea id="prompt" aria-label="Task for NS Work" placeholder="What are we working on?" rows="2" maxlength="12000"></textarea><div class="composer-bottom"><span id="composer-label">Northstar · Sales</span><button type="submit" id="send" aria-label="Send task">↑</button></div></form><div class="composer-note">Built for Northstar. Powered by Deep Agents.</div></div></section>
</div>
</main></div>
<dialog id="detail"><div class="dialog-heading"><div><span id="detail-kicker" class="eyebrow"></span><h2 id="detail-title"></h2></div><button id="close-detail" class="icon-button" aria-label="Close details">×</button></div><div id="detail-body"></div></dialog><div id="toast" role="alert" hidden></div><script src="/app.js?v=20261004-no-code-button"></script></body></html>
